<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>zoma to do list</title>
    
    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/css/bootstrap.rtl.min.css"
      rel="stylesheet"
      integrity="sha384-GJvR3121T9f3y2A6D3b45167b09337535b91b5b42"
      crossorigin="anonymous"
    />
    
    <!-- Google Fonts: Cairo -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="./styles/style.css" />
    
    <!-- jQuery & Client Script -->
    <script src="./vendors/jquery.js"></script>
    <script src="./scripts/client.js"></script>
  </head>
  
  <body class="bg-dark text-light min-vh-100 py-4">
    <div class="container my-auto">
      <!-- Header -->
      <header class="text-center mb-5">
        <div class="d-inline-flex align-items-center justify-content-center gap-3 p-3 rounded-4 glass-card mb-3">
          <img src="./images/checkmark.png" alt="green check mark" width="50" height="50" class="img-fluid" />
          <h1 class="display-5 fw-bold text-gradient m-0">Zoma To-Do List</h1>
        </div>
        <p class="text-muted">منظم المهام اليومية الذكي الخاص بك</p>
      </header>

      <!-- Main Content -->
      <main class="row justify-content-center">
        <div class="col-lg-8">
          
          <!-- Add Task Form Container -->
          <div class="form-div glass-card p-4 rounded-4 mb-5 shadow-lg">
            <h2 class="h4 mb-4 text-gold border-bottom pb-2 border-secondary">
              <i class="fa-solid fa-plus-circle me-2"></i>إضافة مهمة جديدة
            </h2>

            <form class="container-fluid p-0" action="">
              <div class="row g-2 align-items-center">
                <div class="col-10 col-md-9">
                  <input
                    type="text"
                    id="task-in"
                    placeholder="ما الذي تحاول إنجازه اليوم؟"
                    class="form-control form-control-lg bg-dark text-light border-secondary"
                    required
                  />
                </div>
                <div class="col-2 col-md-3">
                  <input
                    type="submit"
                    id="submit-task"
                    value="إضافة"
                    class="btn btn-lg btn-gradient w-100 fw-bold"
                  />
                </div>
              </div>
            </form>
          </div>

          <!-- Task Table List Container -->
          <div class="glass-card p-4 rounded-4 shadow-lg">
            <h3 class="h4 mb-4 text-gold border-bottom pb-2 border-secondary">
              <i class="fa-solid fa-list-check me-2"></i>قائمة مهامي
            </h3>

            <div class="table-responsive">
              <table class="table table-dark table-hover align-middle m-0" id="task-table">
                <thead>
                  <tr class="text-muted text-uppercase fs-7">
                    <th scope="col" style="width: 25%;">الحالة</th>
                    <th scope="col" style="width: 55%;">المهمة</th>
                    <th scope="col" class="text-center" style="width: 20%;">حذف</th>
                  </tr>
                </thead>
                <tbody id="task-table-body">
                  <!-- Dynamic content loaded via jQuery client.js -->
                </tbody>
              </table>
            </div>
          </div>

        </div>
      </main>
    </div>

    <!-- SweetAlert & Bootstrap JS -->
    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-b5kHyXgcpbZJO/tY9Ul7kGkf1S0CWuKcCD38l8YkeH8z8QjE0GmW1gYU5S9FOnJ0"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
